<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MagicMall Deep Layer Renamer</title>

<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

<style>
:root{
  --bg:#0a0a0c; --box:#1c1c1e; --border:#3a3a3c;
  --input:#2c2c2e; --text:#e0e0e0; --muted:#8e8e93;
  --accent:#30d158;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f2f2f7; --box:#fff; --border:#d1d1d6;
    --input:#f2f2f7; --text:#000; --muted:#6e6e73;
  }
}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; margin:0;
}
.box{
  width:390px; background:var(--box);
  border:1px solid var(--border);
  border-radius:20px; padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}

input,select,button{
  width:100%; padding:14px; margin-bottom:12px;
  border-radius:10px; border:1px solid var(--border);
  background:var(--input); color:var(--text);
  font-size:1rem;
}
button{
  background:var(--accent); color:#000;
  font-weight:700; cursor:pointer;
}
button.secondary{
  background:transparent;
  color:var(--text);
}
button:disabled{opacity:.5}

#status,#preview{font-size:.8rem;text-align:center}
#preview{color:#9ef7a4}

.spinner{
  display:none; margin:10px auto;
  width:22px;height:22px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#animPreviewBox{
  width:100%;
  height:190px;
  margin:14px 0;
  border-radius:14px;
  border:1px dashed var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  box-sizing:border-box;
}

#lottiePreview{
  width:160px;
  height:160px;
}

.navBtn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
}
.navBtn:disabled{
  opacity:.3;
  cursor:not-allowed;
}

/* --- NEW STYLES FOR LAYER EDITOR --- */
#layerEditor {
  display: none;
  max-height: 250px;
  overflow-y: auto;
  margin-top: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.2);
}
.layer-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
  transition: background 0.2s;
}
.layer-item:hover { background: rgba(255,255,255,0.05); }
.layer-name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-actions { display: flex; gap: 5px; }
.action-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; width: 24px; padding: 0; margin: 0;
}
.action-btn:hover { color: var(--accent); }
.highlight-layer { outline: 2px solid var(--accent) !important; filter: drop-shadow(0 0 5px var(--accent)); }
</style>
</head>

<body>
<div class="box">
  <h2>Deep Layer Renamer</h2>

  <input type="file" id="files" multiple accept=".json,.tgs">

  <div id="animPreviewBox">
    <button class="navBtn" id="prevAnim">◀</button>
    <div id="lottiePreview"></div>
    <button class="navBtn" id="nextAnim">▶</button>
  </div>

  <input type="text" id="tag" placeholder="Tag text (e.g. @MagicMall)">

  <select id="mode">
    <option value="append">Append — LayerName @Tag</option>
    <option value="prefix">Prefix — @Tag LayerName</option>
    <option value="replace">Replace — @Tag</option>
    <option value="index">Indexed — @Tag_001</option>
    <option value="custom">Toggle Layer — Custom Rename</option>
  </select>

  <div id="layerEditor"></div>

  <button id="previewBtn">Preview</button>
  <button id="downloadBtn" class="secondary" disabled>Download</button>

  <div class="spinner" id="spinner"></div>
  <div id="preview"></div>
  <div id="status">Ready</div>
</div>

<script>
/* =======================
   LOTTIE PREVIEW SYSTEM
======================= */
let lottiePlayer = null;
let previewAnimations = [];
let currentAnimIndex = 0;

const prevBtn = document.getElementById("prevAnim");
const nextBtn = document.getElementById("nextAnim");
const layerEditor = document.getElementById("layerEditor");

function playAnimationByIndex(index){
  if(!previewAnimations.length) return;

  currentAnimIndex = index;

  if(lottiePlayer){
    lottiePlayer.destroy();
  }

  lottiePlayer = lottie.loadAnimation({
    container: document.getElementById("lottiePreview"),
    renderer: "svg",
    loop: true,
    autoplay: true,
    animationData: previewAnimations[currentAnimIndex]
  });

  lottiePlayer.addEventListener('DOMLoaded', () => {
    if(modeEl.value === "custom") renderLayerList();
  });

  prevBtn.disabled =
    previewAnimations.length <= 1 || currentAnimIndex === 0;
  nextBtn.disabled =
    previewAnimations.length <= 1 ||
    currentAnimIndex === previewAnimations.length - 1;
}

prevBtn.onclick = () => {
  if(currentAnimIndex > 0){
    playAnimationByIndex(currentAnimIndex - 1);
  }
};

nextBtn.onclick = () => {
  if(currentAnimIndex < previewAnimations.length - 1){
    playAnimationByIndex(currentAnimIndex + 1);
  }
};

/* =======================
   RENAME LOGIC
======================= */
const filesEl = document.getElementById("files");
const tagEl = document.getElementById("tag");
const modeEl = document.getElementById("mode");
const previewBtn = document.getElementById("previewBtn");
const downloadBtn = document.getElementById("downloadBtn");
const previewEl = document.getElementById("preview");
const statusEl = document.getElementById("status");
const spinner = document.getElementById("spinner");

let cachedData = [];

function renameName(old, tag, mode, i){
  if(mode==="append") return `${old} ${tag}`;
  if(mode==="prefix") return `${tag} ${old}`;
  if(mode==="replace") return tag;
  return `${tag}_${String(i).padStart(3,"0")}`;
}

function walkLayers(layers, tag, mode, stats, previewOnly){
  layers.forEach(l=>{
    if("ty" in l){
      stats.count++;
      if(!previewOnly && mode !== "custom"){
        l.nm = renameName(l.nm || `Layer${stats.count}`, tag, mode, stats.count);
      }
    }
    if(l.layers) walkLayers(l.layers, tag, mode, stats, previewOnly);
  });
}

async function loadFile(file){
  const buf = await file.arrayBuffer();
  return file.name.endsWith(".tgs")
    ? new TextDecoder().decode(pako.ungzip(new Uint8Array(buf)))
    : new TextDecoder().decode(new Uint8Array(buf));
}

/* --- NEW FEATURE LOGIC: LAYER EDITOR --- */

modeEl.onchange = () => {
  layerEditor.style.display = (modeEl.value === "custom") ? "block" : "none";
  if(modeEl.value === "custom") renderLayerList();
};

function renderLayerList() {
  layerEditor.innerHTML = "";
  if (!previewAnimations[currentAnimIndex]) return;

  const layers = previewAnimations[currentAnimIndex].layers;
  layers.forEach((layer, idx) => {
    const item = document.createElement("div");
    item.className = "layer-item";
    
    // Highlight logic
    item.onclick = () => highlightLayerInPreview(idx);

    item.innerHTML = `
      <span class="layer-name" id="ln-${idx}">${layer.nm || 'Layer ' + idx}</span>
      <div class="layer-actions">
        <button class="action-btn" onclick="renameLayerPrompt(${idx}, event)">✏️</button>
        <button class="action-btn" onclick="toggleLayerVisibility(${idx}, event)">👁️</button>
      </div>
    `;
    layerEditor.appendChild(item);
  });
}

function renameLayerPrompt(idx, e) {
  e.stopPropagation();
  const layer = previewAnimations[currentAnimIndex].layers[idx];
  const newName = prompt("Enter new layer name:", layer.nm);
  if (newName !== null) {
    layer.nm = newName;
    document.getElementById(`ln-${idx}`).textContent = newName;
  }
}

function toggleLayerVisibility(idx, e) {
  e.stopPropagation();
  const svgElements = document.getElementById("lottiePreview").querySelectorAll('g[clip-path]');
  // Note: Lottie SVG structure varies, but we find the group corresponding to the layer index
  const target = lottiePlayer.renderer.elements[idx];
  if(target) {
    target.isVisible = !target.isVisible;
    target.hierarchy.forEach(h => h.baseElement.style.display = target.isVisible ? "" : "none");
    e.target.innerText = target.isVisible ? "👁️" : "🚫";
  }
}

function highlightLayerInPreview(idx) {
  // Clear previous highlights
  const allElements = document.getElementById("lottiePreview").querySelectorAll('*');
  allElements.forEach(el => el.classList.remove("highlight-layer"));

  // Apply highlight to specific layer element via Lottie renderer
  const target = lottiePlayer.renderer.elements[idx];
  if(target && target.baseElement) {
    target.baseElement.classList.add("highlight-layer");
    setTimeout(() => target.baseElement.classList.remove("highlight-layer"), 2000);
  }
}

/* AUTO PLAY WHEN FILES IMPORTED */
filesEl.onchange = async () => {
  previewAnimations = [];
  currentAnimIndex = 0;

  if(!filesEl.files.length) return;

  spinner.style.display="block";
  statusEl.textContent="Loading animations...";

  try{
    for(const file of filesEl.files){
      const json = JSON.parse(await loadFile(file));
      if(json.layers) previewAnimations.push(json);
    }

    if(previewAnimations.length){
      playAnimationByIndex(0);
    }

    statusEl.textContent =
      `Loaded ${previewAnimations.length} animation(s)`;

  }catch(e){
    statusEl.textContent="❌ Preview error";
  }

  spinner.style.display="none";
};

/* PREVIEW BUTTON */
previewBtn.onclick = async ()=>{
  if(!filesEl.files.length) return statusEl.textContent="❌ No files selected";
  
  // Only check tag if not in custom mode
  if(modeEl.value !== "custom" && !tagEl.value.trim()) return statusEl.textContent="❌ Tag is empty";

  spinner.style.display="block";
  cachedData=[];
  downloadBtn.disabled=true;

  let total=0;

  for(let i=0; i<filesEl.files.length; i++){
    const file = filesEl.files[i];
    // Use the potentially edited previewAnimations data if it exists
    const json = previewAnimations[i] ? JSON.parse(JSON.stringify(previewAnimations[i])) : JSON.parse(await loadFile(file));
    const stats={count:0};
    walkLayers(json.layers, tagEl.value, modeEl.value, stats, true);
    total+=stats.count;
    cachedData.push({file,json});
  }

  previewEl.textContent =
    `Files: ${filesEl.files.length} | Layers: ${total}`;
  statusEl.textContent="Preview ready ✔";
  downloadBtn.disabled=false;

  spinner.style.display="none";
};

/* DOWNLOAD */
downloadBtn.onclick = ()=>{
  spinner.style.display="block";
  statusEl.textContent="Downloading...";

  cachedData.forEach((item, index)=>{
    const stats={count:0};
    // For custom mode, we use the data already modified in the previewAnimations array
    let finalJson = item.json;
    if(modeEl.value === "custom") {
       finalJson = previewAnimations[index];
    } else {
       walkLayers(finalJson.layers, tagEl.value, modeEl.value, stats, false);
    }

    const out = JSON.stringify(finalJson);
    const data = item.file.name.endsWith(".tgs") ? pako.gzip(out) : out;

    const blob = new Blob([data]);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "renamed_" + item.file.name;
    a.click();
  });

  spinner.style.display="none";
  statusEl.textContent="✔ Download complete";
};
</script>
</body>
</html>
