<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MagicMall Deep Layer Renamer</title>

<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

<style>
:root{
  --bg:#0a0a0c; --box:#1c1c1e; --border:#3a3a3c;
  --input:#2c2c2e; --text:#e0e0e0; --muted:#8e8e93;
  --accent:#30d158;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f2f2f7; --box:#fff; --border:#d1d1d6;
    --input:#f2f2f7; --text:#000; --muted:#6e6e73;
  }
}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; margin:0;
}
.box{
  width:390px; background:var(--box);
  border:1px solid var(--border);
  border-radius:20px; padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}

input,select,button{
  width:100%; padding:14px; margin-bottom:12px;
  border-radius:10px; border:1px solid var(--border);
  background:var(--input); color:var(--text);
  font-size:1rem;
}
button{
  background:var(--accent); color:#000;
  font-weight:700; cursor:pointer;
}
button.secondary{
  background:transparent;
  color:var(--text);
}
button:disabled{opacity:.5}

#status,#preview{font-size:.8rem;text-align:center}
#preview{color:#9ef7a4}

.spinner{
  display:none; margin:10px auto;
  width:22px;height:22px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#animPreviewBox{
  width:100%;
  height:190px;
  margin:14px 0;
  border-radius:14px;
  border:1px dashed var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  box-sizing:border-box;
}

#lottiePreview{
  width:160px;
  height:160px;
}

.navBtn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
}
.navBtn:disabled{
  opacity:.3;
  cursor:not-allowed;
}

/* --- DEEP LAYER TREE STYLES --- */
#layerEditor {
  display: none;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.2);
  text-align: left;
}
.tree-node {
  margin-left: 15px;
  border-left: 1px solid var(--border);
}
.layer-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px;
  font-size: 0.8rem;
}
.layer-item:hover { background: rgba(255,255,255,0.05); }
.layer-name { flex-grow: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle-icon { cursor: pointer; width: 15px; display: inline-block; font-size: 10px; }
.action-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; font-size: 12px; }
.action-btn:hover { color: var(--accent); }
.hidden-children { display: none; }
.highlight-layer { outline: 2px solid var(--accent) !important; filter: drop-shadow(0 0 5px var(--accent)); }
</style>
</head>

<body>
<div class="box">
  <h2>Deep Layer Renamer</h2>

  <input type="file" id="files" multiple accept=".json,.tgs">

  <div id="animPreviewBox">
    <button class="navBtn" id="prevAnim">◀</button>
    <div id="lottiePreview"></div>
    <button class="navBtn" id="nextAnim">▶</button>
  </div>

  <input type="text" id="tag" placeholder="Tag text (e.g. @MagicMall)">

  <select id="mode">
    <option value="append">Append — LayerName @Tag</option>
    <option value="prefix">Prefix — @Tag LayerName</option>
    <option value="replace">Replace — @Tag</option>
    <option value="index">Indexed — @Tag_001</option>
    <option value="custom">Toggle Layers — Deep Custom Edit</option>
  </select>

  <div id="layerEditor"></div>

  <button id="previewBtn">Preview</button>
  <button id="downloadBtn" class="secondary" disabled>Download</button>

  <div class="spinner" id="spinner"></div>
  <div id="preview"></div>
  <div id="status">Ready</div>
</div>

<script>
/* =======================
   LOTTIE PREVIEW SYSTEM
======================= */
let lottiePlayer = null;
let previewAnimations = [];
let currentAnimIndex = 0;

const prevBtn = document.getElementById("prevAnim");
const nextBtn = document.getElementById("nextAnim");
const layerEditor = document.getElementById("layerEditor");

function playAnimationByIndex(index){
  if(!previewAnimations.length) return;
  currentAnimIndex = index;
  if(lottiePlayer) lottiePlayer.destroy();

  lottiePlayer = lottie.loadAnimation({
    container: document.getElementById("lottiePreview"),
    renderer: "svg",
    loop: true,
    autoplay: true,
    animationData: previewAnimations[currentAnimIndex]
  });

  lottiePlayer.addEventListener('DOMLoaded', () => {
    if(modeEl.value === "custom") renderDeepLayerTree();
  });

  prevBtn.disabled = previewAnimations.length <= 1 || currentAnimIndex === 0;
  nextBtn.disabled = previewAnimations.length <= 1 || currentAnimIndex === previewAnimations.length - 1;
}

prevBtn.onclick = () => { if(currentAnimIndex > 0) playAnimationByIndex(currentAnimIndex - 1); };
nextBtn.onclick = () => { if(currentAnimIndex < previewAnimations.length - 1) playAnimationByIndex(currentAnimIndex + 1); };

/* =======================
   RENAME LOGIC
======================= */
const filesEl = document.getElementById("files");
const tagEl = document.getElementById("tag");
const modeEl = document.getElementById("mode");
const previewBtn = document.getElementById("previewBtn");
const downloadBtn = document.getElementById("downloadBtn");
const previewEl = document.getElementById("preview");
const statusEl = document.getElementById("status");
const spinner = document.getElementById("spinner");

let cachedData = [];

function renameName(old, tag, mode, i){
  if(mode==="append") return `${old} ${tag}`;
  if(mode==="prefix") return `${tag} ${old}`;
  if(mode==="replace") return tag;
  return `${tag}_${String(i).padStart(3,"0")}`;
}

function walkLayers(layers, tag, mode, stats, previewOnly){
  layers.forEach(l=>{
    if("ty" in l){
      stats.count++;
      if(!previewOnly && mode !== "custom"){
        l.nm = renameName(l.nm || `Layer${stats.count}`, tag, mode, stats.count);
      }
    }
    if(l.layers) walkLayers(l.layers, tag, mode, stats, previewOnly);
    if(l.shapes) walkShapes(l.shapes, tag, mode, stats, previewOnly);
  });
}

function walkShapes(shapes, tag, mode, stats, previewOnly) {
  shapes.forEach(s => {
    if(s.nm) {
       stats.count++;
       if(!previewOnly && mode !== "custom") s.nm = renameName(s.nm, tag, mode, stats.count);
    }
    if(s.it) walkShapes(s.it, tag, mode, stats, previewOnly);
  });
}

async function loadFile(file){
  const buf = await file.arrayBuffer();
  return file.name.endsWith(".tgs")
    ? new TextDecoder().decode(pako.ungzip(new Uint8Array(buf)))
    : new TextDecoder().decode(new Uint8Array(buf));
}

/* --- NEW FEATURE: DEEP TREE RENDERER --- */

modeEl.onchange = () => {
  layerEditor.style.display = (modeEl.value === "custom") ? "block" : "none";
  if(modeEl.value === "custom") renderDeepLayerTree();
};

function createTreeElement(item, index, type = 'layer') {
  const container = document.createElement("div");
  container.className = "tree-node-container";

  const row = document.createElement("div");
  row.className = "layer-item";

  const hasChildren = (item.layers && item.layers.length) || (item.it && item.it.length);
  
  const toggle = document.createElement("span");
  toggle.className = "toggle-icon";
  toggle.innerHTML = hasChildren ? "▶" : "";
  
  const nameLabel = document.createElement("span");
  nameLabel.className = "layer-name";
  nameLabel.textContent = item.nm || (type === 'layer' ? `Layer ${index}` : `Group ${index}`);
  
  // Highlight on click
  nameLabel.onclick = () => {
    const el = lottiePlayer.renderer.elements.find(e => e.data === item);
    if(el && el.baseElement) {
        el.baseElement.classList.add("highlight-layer");
        setTimeout(() => el.baseElement.classList.remove("highlight-layer"), 1500);
    }
  };

  const actions = document.createElement("div");
  actions.innerHTML = `
    <button class="action-btn" title="Rename">✏️</button>
    <button class="action-btn" title="Hide/Show">👁️</button>
  `;

  actions.querySelectorAll('.action-btn')[0].onclick = () => {
    const n = prompt("New Name:", item.nm);
    if(n) { item.nm = n; nameLabel.textContent = n; }
  };

  actions.querySelectorAll('.action-btn')[1].onclick = (e) => {
    const el = lottiePlayer.renderer.elements.find(e => e.data === item);
    if(el) {
      const isHidden = el.baseElement.style.display === "none";
      el.baseElement.style.display = isHidden ? "" : "none";
      e.target.innerText = isHidden ? "👁️" : "🚫";
    }
  };

  row.appendChild(toggle);
  row.appendChild(nameLabel);
  row.appendChild(actions);
  container.appendChild(row);

  if(hasChildren) {
    const childContainer = document.createElement("div");
    childContainer.className = "tree-node hidden-children";
    
    toggle.onclick = () => {
      const isHidden = childContainer.classList.toggle("hidden-children");
      toggle.innerHTML = isHidden ? "▶" : "▼";
    };

    if(item.layers) item.layers.forEach((l, i) => childContainer.appendChild(createTreeElement(l, i, 'layer')));
    if(item.it) item.it.forEach((s, i) => childContainer.appendChild(createTreeElement(s, i, 'group')));
    
    container.appendChild(childContainer);
  }

  return container;
}

function renderDeepLayerTree() {
  layerEditor.innerHTML = "<strong>Layer Hierarchy:</strong><br>";
  if (!previewAnimations[currentAnimIndex]) return;
  previewAnimations[currentAnimIndex].layers.forEach((l, i) => {
    layerEditor.appendChild(createTreeElement(l, i));
  });
}

/* AUTO PLAY WHEN FILES IMPORTED */
filesEl.onchange = async () => {
  previewAnimations = [];
  currentAnimIndex = 0;
  if(!filesEl.files.length) return;
  spinner.style.display="block";
  statusEl.textContent="Loading animations...";
  try{
    for(const file of filesEl.files){
      const json = JSON.parse(await loadFile(file));
      if(json.layers) previewAnimations.push(json);
    }
    if(previewAnimations.length) playAnimationByIndex(0);
    statusEl.textContent = `Loaded ${previewAnimations.length} animation(s)`;
  }catch(e){ statusEl.textContent="❌ Preview error"; }
  spinner.style.display="none";
};

/* PREVIEW BUTTON */
previewBtn.onclick = async ()=>{
  if(!filesEl.files.length) return statusEl.textContent="❌ No files selected";
  if(modeEl.value !== "custom" && !tagEl.value.trim()) return statusEl.textContent="❌ Tag is empty";
  spinner.style.display="block";
  cachedData=[];
  downloadBtn.disabled=true;
  let total=0;
  for(let i=0; i<filesEl.files.length; i++){
    const file = filesEl.files[i];
    const json = previewAnimations[i] ? JSON.parse(JSON.stringify(previewAnimations[i])) : JSON.parse(await loadFile(file));
    const stats={count:0};
    walkLayers(json.layers, tagEl.value, modeEl.value, stats, true);
    total+=stats.count;
    cachedData.push({file,json});
  }
  previewEl.textContent = `Files: ${filesEl.files.length} | Layers: ${total}`;
  statusEl.textContent="Preview ready ✔";
  downloadBtn.disabled=false;
  spinner.style.display="none";
};

/* DOWNLOAD */
downloadBtn.onclick = ()=>{
  spinner.style.display="block";
  statusEl.textContent="Downloading...";
  cachedData.forEach((item, index)=>{
    let finalJson = item.json;
    if(modeEl.value === "custom") {
       finalJson = previewAnimations[index];
    } else {
       const stats={count:0};
       walkLayers(finalJson.layers, tagEl.value, modeEl.value, stats, false);
    }
    const out = JSON.stringify(finalJson);
    const data = item.file.name.endsWith(".tgs") ? pako.gzip(out) : out;
    const blob = new Blob([data]);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "renamed_" + item.file.name;
    a.click();
  });
  spinner.style.display="none";
  statusEl.textContent="✔ Download complete";
};
</script>
</body>
</html>
